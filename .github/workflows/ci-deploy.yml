name: CI / deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            infra/requirements*.txt
            backend/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend + eval scoring tests
        run: |
          pip install -r backend/requirements-dev.txt
          pytest backend/tests eval -q

      - name: Infra tests
        working-directory: infra
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest -q

      - name: Frontend typecheck + build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write    # OIDC -> AWS, no stored access keys
      contents: read
    steps:
      - name: Check deploy role secret
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Secret AWS_DEPLOY_ROLE_ARN is not set. Run 'cdk deploy SyllabusAgentGithubOidc' once, then add its DeployRoleArn output under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: cdk deploy
        working-directory: infra
        run: |
          pip install -r requirements.txt
          npm install -g aws-cdk
          cdk deploy SyllabusAgentStack --require-approval never \
            ${{ vars.ALARM_EMAIL && format('--context alarmEmail={0}', vars.ALARM_EMAIL) || '' }} \
            ${{ vars.NOTIFY_FROM_EMAIL && format('--context notifyFromEmail={0}', vars.NOTIFY_FROM_EMAIL) || '' }} \
            ${{ vars.APP_URL && format('--context appUrl={0}', vars.APP_URL) || '' }}
